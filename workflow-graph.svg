<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 888.0 345.0" width="700" role="img" aria-labelledby="ttl desc" style="max-width:100%;height:auto;font-family:ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
<title id="ttl">A validated workflow graph: draft, check, and either loop back or publish</title>
<desc id="desc">Four steps left to right. An input feeds a draft step. The draft flows to a check step. The check step has two guarded exits: when the verdict is fail it loops back to the draft step carrying the issues as feedback; when the verdict is pass it flows to a human-gated publish step and then to the output. Because both outcomes are covered, no work item can be silently dropped.</desc>
